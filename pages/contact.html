<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Om Namah Shivay Travels</title>
<meta name="description" content="Get in touch with Om Namah Shivay Travels by phone, email or WhatsApp to plan your next tour.">
<link rel="icon" type="image/svg+xml" href="../images/logo/logo.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts and icons load asynchronously (preload + swap) so a slow or
     unreachable CDN never blocks the page from rendering or appearing "stuck". -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" onload="this.onload=null;this.rel='stylesheet'">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
</noscript>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">

<script>const BASE_PATH = "../";</script>
</head>
<body>

<a class="visually-hidden" href="#page-content">Skip to main content</a>
<div id="site-header"></div>

<main id="page-content">

  <section class="page-hero">
    <svg class="page-hero-om" viewBox="0 0 100 100" aria-hidden="true"><text x="50" y="58" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="90" fill="currentColor">&#2384;</text></svg>
    <div class="container">
      <nav class="breadcrumbs" aria-label="Breadcrumb" style="color:rgba(255,255,255,0.7)">
        <a href="../index.html" style="color:#fff">Home</a> <span>/</span> <span aria-current="page">Contact</span>
      </nav>
      <h1>Contact Us</h1>
      <p>Have a question about a tour, or ready to book? Reach out — we usually reply within the hour.</p>
    </div>
  </section>

  <section class="section">
    <div class="container contact-grid">

      <div data-reveal>
        <h2>Get In Touch</h2>
        <ul class="contact-info-list" id="contactInfo"></ul>

        <div class="map-embed" id="contactMap"></div>
      </div>

      <div class="form-card" data-reveal>
        <h2>Send an Enquiry</h2>
        <p class="form-note">Filling this form opens WhatsApp with your details pre-filled — we don't store anything on a server.</p>

        <form id="contactForm" novalidate>
          <div class="form-grid">
            <div class="form-field">
              <label for="contactName">Full Name *</label>
              <input type="text" id="contactName" name="name" required autocomplete="name">
              <p class="field-error" role="alert"></p>
            </div>
            <div class="form-field">
              <label for="contactMobile">Mobile Number *</label>
              <input type="tel" id="contactMobile" name="mobile" required inputmode="numeric" placeholder="98765 43210" autocomplete="tel">
              <p class="field-error" role="alert"></p>
            </div>
            <div class="form-field">
              <label for="contactEmail">Email Address</label>
              <input type="email" id="contactEmail" name="email" autocomplete="email">
              <p class="field-error" role="alert"></p>
            </div>
            <div class="form-field">
              <label for="contactTour">Preferred Tour</label>
              <input type="text" id="contactTour" name="tour" placeholder="e.g. Jyotirlinga Pilgrimage Tour">
              <p class="field-error" role="alert"></p>
            </div>
            <div class="form-field">
              <label for="contactDate">Travel Date</label>
              <input type="date" id="contactDate" name="date">
              <p class="field-error" role="alert"></p>
            </div>
            <div class="form-field">
              <label for="contactTravelers">Number of Travelers</label>
              <input type="number" id="contactTravelers" name="travelers" min="1" max="100">
              <p class="field-error" role="alert"></p>
            </div>
            <div class="form-field full">
              <label for="contactMessage">Message</label>
              <textarea id="contactMessage" name="message" placeholder="Tell us anything else that will help us plan your trip"></textarea>
              <p class="field-error" role="alert"></p>
            </div>
          </div>
          <button type="submit" class="btn btn-whatsapp btn-block">
            <i class="fa-brands fa-whatsapp" aria-hidden="true"></i><span>Send via WhatsApp</span>
          </button>
        </form>
      </div>

    </div>
  </section>

</main>

<div id="site-footer"></div>
<div id="floating-actions"></div>

<script src="../js/config.js" defer></script>
<script src="../js/data.js" defer></script>
<script src="../js/components.js" defer></script>
<script src="../js/main.js" defer></script>
<script src="../js/pages.js" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    initPage({
      activePageId: "contact",
      seo: { title: "Contact Us", description: "Get in touch with Om Namah Shivay Travels by phone, email or WhatsApp." }
    });
    initContactPage();
  });
</script>
</body>
</html>
