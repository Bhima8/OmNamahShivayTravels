<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tours | Om Namah Shivay Travels</title>
<meta name="description" content="Browse pilgrimage, family, nature and custom group tours from Om Namah Shivay Travels. Search and filter by category or duration.">
<link rel="icon" type="image/svg+xml" href="../images/logo/logo.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

     unreachable CDN never blocks the page from rendering or appearing "stuck". -->

<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" onload="this.onload=null;this.rel='stylesheet'">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
</noscript>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">

<script>const BASE_PATH = "../";</script>
</head>
<body>

<a class="visually-hidden" href="#page-content">Skip to main content</a>
<div id="site-header"></div>

<main id="page-content">

  <section class="page-hero">
    <svg class="page-hero-om" viewBox="0 0 100 100" aria-hidden="true"><text x="50" y="58" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="90" fill="currentColor">&#2384;</text></svg>
    <div class="container">
      <nav class="breadcrumbs" aria-label="Breadcrumb" style="color:rgba(255,255,255,0.7)">
        <a href="../index.html" style="color:#fff">Home</a> <span>/</span> <span aria-current="page">Tours</span>
      </nav>
      <h1>Pilgrimage &amp; Holiday Tours</h1>
      <p>Search or filter to find the right tour, or simply browse everything we offer.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">

      <div class="toolbar">
        <label class="search-field">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input type="search" id="tourSearch" placeholder="Search by tour name or destination">
          <span class="visually-hidden">Search tours</span>
        </label>
        <label class="visually-hidden" for="tourCategoryFilter">Filter by category</label>
        <select id="tourCategoryFilter"></select>
        <label class="visually-hidden" for="tourDurationFilter">Filter by duration</label>
        <select id="tourDurationFilter"></select>
      </div>

      <p class="results-count" id="toursResultsCount"></p>

      <div class="grid grid-3" id="toursGrid"></div>
    </div>
  </section>

</main>

<div id="site-footer"></div>
<div id="floating-actions"></div>

<script src="../js/config.js" defer></script>
<script src="../js/data.js" defer></script>
<script src="../js/components.js" defer></script>
<script src="../js/main.js" defer></script>
<script src="../js/pages.js" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    initPage({
      activePageId: "tours",
      seo: { title: "Tours", description: "Browse pilgrimage, family, nature and custom group tours." }
    });
    initToursPage();
  });
</script>
</body>
